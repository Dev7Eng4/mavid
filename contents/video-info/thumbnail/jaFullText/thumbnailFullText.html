<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        background: #050a14;
      }
      #thumbCanvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="thumbCanvas" width="1280" height="720"></canvas>

    <script>
      const W = 1280;
      const H = 720;
      const canvas = document.getElementById('thumbCanvas');
      const ctx = canvas.getContext('2d');

      /** @type {{ L1: string, L2: string, L3: string, L4: string, L5: string }} */
      const DEFAULT_LINES = {
        L1: '',
        L2: '',
        L3: '',
        L4: '',
        L5: '',
      };

      const DEFAULT_TEXT_STYLES = {
        L1: {
          fill: '',
          stroke: '',
          stroke_width_role: 'normal',
          shadow: '#000000',
        },
        L2: {
          fill: '#FFFFFF',
          stroke: '#000000',
          stroke_width_role: 'normal',
          shadow: '#000000',
        },
        L3: {
          fill: '#FFFFFF',
          stroke: '#000000',
          stroke_width_role: 'normal',
          shadow: '#000000',
        },
        L4: {
          fill: '#FFFFFF',
          stroke: '#000000',
          stroke_width_role: 'normal',
          shadow: '#000000',
        },
        L5: {
          fill: '#FFFFFF',
          stroke: '#000000',
          stroke_width_role: 'normal',
          shadow: '#000000',
        },
      };

      const DEFAULT_BACKGROUND = {
        base_from: '#16223d',
        base_to: '#050a14',
        accent_color: '#FF66B2',
      };

      function mergeThumbnailPayload(raw) {
        const out = {
          thumbnail_copy: { ...DEFAULT_LINES },
          text_styles: { ...DEFAULT_TEXT_STYLES },
          background: { ...DEFAULT_BACKGROUND },
        };
        if (raw && typeof raw === 'object') {
          if (raw.thumbnail_copy && typeof raw.thumbnail_copy === 'object') Object.assign(out.thumbnail_copy, raw.thumbnail_copy);
          if (raw.text_styles && typeof raw.text_styles === 'object') Object.assign(out.text_styles, raw.text_styles);
          if (raw.background && typeof raw.background === 'object') Object.assign(out.background, raw.background);
        }
        return out;
      }

      /**
       * @param {typeof DEFAULT_LINES} lines
       * @param {typeof DEFAULT_COLORS} colors
       */
      async function drawThumbnail(thumbnail_copy, text_styles, background) {
        console.log('🚀 ~ drawThumbnail ~ background:', background);
        console.log('🚀 ~ drawThumbnail ~ text_styles:', text_styles);
        console.log('🚀 ~ drawThumbnail ~ thumbnail_copy:', thumbnail_copy);
        const from = background?.base_from ?? DEFAULT_BACKGROUND.base_from;
        const to = background?.base_to ?? DEFAULT_BACKGROUND.base_to;
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, from);
        bg.addColorStop(1, to);
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        await document.fonts.load(`900 220px "Noto Sans JP"`);
        await document.fonts.ready;

        const sideMargin = 15;
        const maxTextWidth = W - 2 * sideMargin;

        const jp = '900 %sizepx "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", "MS Gothic", sans-serif';

        /**
         * 「」(U+300C/U+300D) là ngoặc góc toàn chiều — advance width ~1em, trông “rộng gấp đôi”
         * so với mong muốn 1 ô. ｢｣ (U+FF62/U+FF63) là bản nửa chiều, cùng kiểu glyph nhưng hẹp hơn.
         */
        function narrowCornerQuotes(s) {
          return String(s).replaceAll('\u300C', '\uFF62').replaceAll('\u300D', '\uFF63');
        }

        function drawText(text, x, y, fontSize, color, strokeColor, strokeWidth, isGlow = false) {
          text = narrowCornerQuotes(text);
          ctx.font = jp.replace('%size', String(fontSize));
          ctx.textBaseline = 'alphabetic';
          ctx.lineJoin = 'round';
          ctx.miterLimit = 2;

          const naturalW = ctx.measureText(text).width;
          const scaleX = naturalW > maxTextWidth ? maxTextWidth / naturalW : 1;
          const lineW = scaleX < 1 ? strokeWidth / scaleX : strokeWidth;

          /** Độ dày giả lập (theo px màn hình); bù scale ngang để không bị mảnh khi nén. */
          const boldScreenPx = Math.max(0.45, fontSize * 0.0055);
          const bdx = boldScreenPx / scaleX;
          const bdy = boldScreenPx;
          const boldDirs = [
            [bdx, 0],
            [-bdx, 0],
            [0, bdy],
            [0, -bdy],
          ];

          ctx.save();
          ctx.translate(x, y);
          ctx.scale(scaleX, 1);
          ctx.textAlign = 'left';
          const leftX = 0;

          ctx.shadowBlur = 0;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 0;
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = lineW;
          ctx.strokeText(text, leftX, 0);

          ctx.fillStyle = color;
          for (const [ox, oy] of boldDirs) {
            ctx.fillText(text, leftX + ox, oy);
          }

          if (isGlow) {
            ctx.shadowColor = color;
            ctx.shadowBlur = scaleX < 1 ? 32 / scaleX : 32;
          }
          ctx.fillText(text, leftX, 0);
          ctx.shadowBlur = 0;
          ctx.restore();
        }

        const x = sideMargin;
        const stroke = '#000000';

        drawText(String(thumbnail_copy.L1 ?? ''), x, 105, 110, text_styles.L1.fill, text_styles.L1.stroke, 10);
        drawText(String(thumbnail_copy.L2 ?? ''), x, 225, 110, text_styles.L2.fill, text_styles.L2.stroke, 8);
        drawText(String(thumbnail_copy.L3 ?? ''), x, 345, 110, text_styles.L3.fill, text_styles.L3.stroke, 26 / 3);
        drawText(String(thumbnail_copy.L4 ?? ''), x, 465, 110, text_styles.L4.fill, text_styles.L4.stroke, 8);
        drawText(String(thumbnail_copy.L5 ?? ''), x, 690, 220, text_styles.L5.fill, text_styles.L5.stroke, 12, false);
      }

      function runThumbnailFromPayload() {
        const payload = mergeThumbnailPayload(window.__THUMB_PAYLOAD__);
        return drawThumbnail(payload.thumbnail_copy, payload.text_styles, payload.background);
      }

      window.drawThumbnail = drawThumbnail;
      window.mergeThumbnailPayload = mergeThumbnailPayload;

      runThumbnailFromPayload()
        .then(() => {
          window.__THUMBNAIL_READY__ = true;
        })
        .catch(e => {
          window.__THUMBNAIL_ERROR__ = String(e);
        });
    </script>
  </body>
</html>
